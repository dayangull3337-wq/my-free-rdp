name: Windows 10 RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "Pass12345@" -AsPlainText -Force
          New-LocalUser -Name "runner" -Password $password -FullName "Runner User" -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runner" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runner" -ErrorAction SilentlyContinue

      - name: Install Bore Tunnel
        run: |
          choco install bore-cli -y

      - name: Start Bore Tunnel & Show Connection
        run: |
          bore local 3389 --to bore.pub
