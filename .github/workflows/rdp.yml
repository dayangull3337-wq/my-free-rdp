name: Windows 10 RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "Pass12345@" -AsPlainText -Force
          New-LocalUser -Name "runner" -Password $password -FullName "Runner User" -Description "RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "runner"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runner"

      - name: Install & Start Pinggy Tunnel
        run: |
          curl.exe -o pinggy.exe https://github.com/pinggy-io/pinggy-cli/releases/latest/download/pinggy_windows_amd64.exe
          Start-Process -FilePath ".\pinggy.exe" -ArgumentList "-p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Get Connection Details
        run: |
          Write-Output "=========================================="
          Write-Output "--- WINDOWS RDP DETAILS ---"
          Get-Content pinggy.log | Select-String "tcp://"
          Write-Output "Username: runner"
          Write-Output "Password: Pass12345@"
          Write-Output "=========================================="

      - name: Keep Alive (6 Hours)
        run: Start-Sleep -Seconds 21600
