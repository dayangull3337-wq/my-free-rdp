name: Windows 10 RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP & Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = ConvertTo-SecureString "Pass12345@" -AsPlainText -Force
          New-LocalUser -Name "runner" -Password $password -FullName "Runner User" -Description "RDP User" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runner" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runner" -ErrorAction SilentlyContinue

      - name: Download & Setup Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyA1xipbS4/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "."
          # Yahan APNA_NGROK_AUTHTOKEN ki jagah apna token paste karein
          .\ngrok.exe config add-authtoken APNA_NGROK_AUTHTOKEN

      - name: Start Ngrok & Connect
        run: |
          .\ngrok.exe tcp 3389
